name: snapapp
version: 0.0.0
summary: Test snap build with github workflow
description: |
  Testing.

base: core22
grade: stable
confinement: strict

apps:
  snapapp:
    command: snapapp
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - network
      - home
      - network-bind
      - password-manager-service
      - secret-service

parts:
  snapapp:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - clang
      - cmake
      - ninja-build
      - libgtk-3-dev
      - libblkid-dev
      - liblzma-dev
      - libsecret-1-dev
      - libjsoncpp-dev
      - libssl-dev
    stage-packages:
      - libsecret-1-0
      - libjsoncpp-dev
      - libssl3
